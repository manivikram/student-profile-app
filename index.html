<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Profile App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1226; --panel:#1B2140; --panel-2:#232B52; --line:#323b66;
    --indigo:#6C7CF0; --indigo-soft:#3a3f7a; --mint:#3ED9B8;
    --text:#EDEFFA; --muted:#8890B5;
    --display: 'Space Grotesk', sans-serif; --body: 'Inter', sans-serif; --mono: 'Space Mono', monospace;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 20% 10%, #23295c 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, #1a2148 0%, transparent 50%), var(--ink);
    font-family: var(--body); padding: 32px 16px;
  }
  .device{
    width: 380px; max-width: 100%; background: var(--panel); border-radius: 36px;
    border: 1px solid var(--line);
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
    overflow: hidden; position: relative;
  }
  .statusbar{ display:flex; justify-content:space-between; align-items:center; padding: 16px 24px 4px;
    font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.5px; }
  .signal{ display:flex; gap:2px; align-items:flex-end; }
  .signal span{ width:3px; background:var(--muted); border-radius:1px; display:block; }
  .signal span:nth-child(1){height:4px;} .signal span:nth-child(2){height:6px;}
  .signal span:nth-child(3){height:8px;} .signal span:nth-child(4){height:10px;}
  .appbar{ display:flex; align-items:center; justify-content:space-between; padding: 12px 24px 8px; }
  .appbar .back{ width:32px;height:32px;border-radius:10px; background: var(--panel-2);
    display:flex;align-items:center;justify-content:center; color:var(--muted); font-size:16px; }
  .appbar .title{ font-family: var(--display); font-size: 13px; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--muted); }
  .appbar .menu-dot{ color:var(--muted); font-size:18px; }
  .hero{ padding: 18px 24px 4px; }
  .hero .eyebrow{ font-family: var(--mono); font-size: 11px; color: var(--mint);
    letter-spacing: 1px; margin-bottom: 6px; }
  .hero h1{ font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.15;
    margin: 0; color: var(--text); }
  .hero p.sub{ margin: 6px 0 0; font-size: 13.5px; color: var(--muted); }
</style>
</head>
<body>

  <main class="device">

    <div class="statusbar">
      <span>9:41</span>
      <div class="dots">
        <div class="signal"><span></span><span></span><span></span><span></span></div>
      </div>
    </div>

    <div class="appbar">
      <div class="back">‹</div>
      <div class="title">Student Profile</div>
      <div class="menu-dot">⋯</div>
    </div>

    <section class="hero">
      <div class="eyebrow">● Welcome back</div>
      <h1>Welcome to the<br>Student Profile App</h1>
      <p class="sub">Your campus ID, course info, and contact details — all in one place.</p>
    </section>

  </main>

</body>
</html>
